# nginx proxy address - http://172.17.0.1:64580
# search - development

name: search

x-logging: &default-logging
  options:
    max-size: "5m"
    max-file: "1"
  driver: json-file

services:
  search:
    image: ghcr.io/apimgr/search:${IMAGE_TAG:-devel}
    container_name: search-app
    hostname: search
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      PORT: 80
      DEBUG: true
      MODE: development
      DOMAIN: ${DOMAIN:-}
      TZ: ${TZ:-America/New_York}
      GOOGLE_SAFE_BROWSING_API_KEY: ${GOOGLE_SAFE_BROWSING_API_KEY:-}
      PHISHTANK_API_KEY: ${PHISHTANK_API_KEY:-}
    volumes:
      - ${CONFIG_PATH:-./volumes/config}:/config:z
      - ${DATA_PATH:-./volumes/data}:/data:z
    ports:
      # Development: accessible from all interfaces, no 172.17.0.1 bind
      - "${PORT:-64580}:80"
    healthcheck:
      test: ["CMD", "/usr/local/bin/search", "--status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - search

networks:
  search:
    name: search
    external: false
