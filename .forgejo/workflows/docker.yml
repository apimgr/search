name: Docker Build

on:
  push:
    branches: ['**']
    tags:
      - 'v*'
      - '*.*.*'
  schedule:
    # 4am UTC daily — rebuild the devel image even without new commits
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ forgejo.ref }}
  cancel-in-progress: ${{ forgejo.ref == 'refs/heads/main' || forgejo.ref == 'refs/heads/master' || forgejo.ref == 'refs/heads/devel' || forgejo.ref == 'refs/heads/dev' || forgejo.ref == 'refs/heads/beta' }}

env:
  PROJECTNAME: search
  # Registry auto-detected from the Forgejo server URL (self-hosted, no fixed host like ghcr.io)
  IMAGE_NAME: ${{ forgejo.repository }}

jobs:
  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    if: forgejo.event_name != 'schedule'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3  # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Set registry from server URL
        run: |
          SERVER_URL="${{ forgejo.server_url }}"
          REGISTRY="${SERVER_URL#https://}"
          REGISTRY="${REGISTRY#http://}"
          echo "REGISTRY=${REGISTRY}" >> "$FORGEJO_ENV"

      - name: Log in to Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ forgejo.actor }}
          password: ${{ secrets.FORGEJO_TOKEN }}

      - name: Set build info
        run: |
          echo "COMMIT_ID=$(git rev-parse --short=7 HEAD)" >> "$FORGEJO_ENV"
          echo "YYMM=$(date +"%y%m")" >> "$FORGEJO_ENV"
          if [[ "${{ forgejo.ref }}" == refs/tags/* ]]; then
            VERSION="${FORGEJO_REF_NAME}"
            echo "VERSION=${VERSION#v}" >> "$FORGEJO_ENV"
            echo "IS_TAG=true" >> "$FORGEJO_ENV"
          else
            echo "VERSION=$(git rev-parse --short=7 HEAD)" >> "$FORGEJO_ENV"
            echo "IS_TAG=false" >> "$FORGEJO_ENV"
          fi
          EPOCH="$(date -u +%s)"
          echo "BUILD_EPOCH=${EPOCH}" >> "$FORGEJO_ENV"
          echo "BUILD_DATE=$(date -u -d @"${EPOCH}" +"%Y-%m-%dT%H:%M:%SZ")" >> "$FORGEJO_ENV"

      - name: Determine tags
        id: tags
        run: |
          PROD_TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.COMMIT_ID }}"
          DEV_TAGS=""
          if [[ "${{ env.IS_TAG }}" == "true" ]]; then
            PROD_TAGS="$PROD_TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}"
            PROD_TAGS="$PROD_TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            PROD_TAGS="$PROD_TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.YYMM }}"
          else
            DEV_TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:devel"
            if [[ "${{ forgejo.ref }}" == refs/heads/beta ]]; then
              DEV_TAGS="$DEV_TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:beta"
            fi
          fi
          echo "prod_tags=$PROD_TAGS" >> "$FORGEJO_OUTPUT"
          echo "dev_tags=$DEV_TAGS" >> "$FORGEJO_OUTPUT"

      - name: Build and push production image
        if: steps.tags.outputs.prod_tags != ''
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.prod_tags }}
          build-args: |
            VERSION=${{ env.VERSION }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            BUILD_EPOCH=${{ env.BUILD_EPOCH }}
            COMMIT_ID=${{ env.COMMIT_ID }}
          labels: |
            maintainer=casjay <casjay@yahoo.com>
            org.opencontainers.image.vendor=apimgr
            org.opencontainers.image.authors=apimgr
            org.opencontainers.image.title=${{ env.PROJECTNAME }}
            org.opencontainers.image.base.name=${{ env.PROJECTNAME }}
            org.opencontainers.image.description=Privacy-respecting self-hosted metasearch engine
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.schema-version=${{ env.VERSION }}
            org.opencontainers.image.created=${{ env.BUILD_DATE }}
            org.opencontainers.image.revision=${{ env.COMMIT_ID }}
            org.opencontainers.image.url=${{ forgejo.server_url }}/${{ forgejo.repository }}
            org.opencontainers.image.source=${{ forgejo.server_url }}/${{ forgejo.repository }}
            org.opencontainers.image.documentation=${{ forgejo.server_url }}/${{ forgejo.repository }}
            org.opencontainers.image.vcs-type=Git
            org.opencontainers.image.licenses=MIT
            com.github.containers.toolbox=false
          annotations: |
            manifest:maintainer=casjay <casjay@yahoo.com>
            manifest:org.opencontainers.image.vendor=apimgr
            manifest:org.opencontainers.image.authors=apimgr
            manifest:org.opencontainers.image.title=${{ env.PROJECTNAME }}
            manifest:org.opencontainers.image.description=Privacy-respecting self-hosted metasearch engine
            manifest:org.opencontainers.image.version=${{ env.VERSION }}
            manifest:org.opencontainers.image.schema-version=${{ env.VERSION }}
            manifest:org.opencontainers.image.created=${{ env.BUILD_DATE }}
            manifest:org.opencontainers.image.revision=${{ env.COMMIT_ID }}
            manifest:org.opencontainers.image.url=${{ forgejo.server_url }}/${{ forgejo.repository }}
            manifest:org.opencontainers.image.source=${{ forgejo.server_url }}/${{ forgejo.repository }}
            manifest:org.opencontainers.image.documentation=${{ forgejo.server_url }}/${{ forgejo.repository }}
            manifest:org.opencontainers.image.vcs-type=Git
            manifest:org.opencontainers.image.licenses=MIT
            manifest:com.github.containers.toolbox=false

  build-devel:
    name: Build and push devel image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3  # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Set registry from server URL
        run: |
          SERVER_URL="${{ forgejo.server_url }}"
          REGISTRY="${SERVER_URL#https://}"
          REGISTRY="${REGISTRY#http://}"
          echo "REGISTRY=${REGISTRY}" >> "$FORGEJO_ENV"

      - name: Log in to Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ forgejo.actor }}
          password: ${{ secrets.FORGEJO_TOKEN }}

      - name: Set build info
        run: |
          echo "COMMIT_ID=$(git rev-parse --short=7 HEAD)" >> "$FORGEJO_ENV"
          echo "YYMM=$(date +"%y%m")" >> "$FORGEJO_ENV"
          if [[ "${{ forgejo.ref }}" == refs/tags/* ]]; then
            VERSION="${FORGEJO_REF_NAME}"
            echo "VERSION=${VERSION#v}" >> "$FORGEJO_ENV"
            echo "IS_TAG=true" >> "$FORGEJO_ENV"
          else
            echo "VERSION=$(git rev-parse --short=7 HEAD)" >> "$FORGEJO_ENV"
            echo "IS_TAG=false" >> "$FORGEJO_ENV"
          fi
          EPOCH="$(date -u +%s)"
          echo "BUILD_EPOCH=${EPOCH}" >> "$FORGEJO_ENV"
          echo "BUILD_DATE=$(date -u -d @"${EPOCH}" +"%Y-%m-%dT%H:%M:%SZ")" >> "$FORGEJO_ENV"

      - name: Determine tags
        id: tags
        run: |
          PROD_TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.COMMIT_ID }}"
          DEV_TAGS=""
          if [[ "${{ env.IS_TAG }}" == "true" ]]; then
            PROD_TAGS="$PROD_TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}"
            PROD_TAGS="$PROD_TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            PROD_TAGS="$PROD_TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.YYMM }}"
          else
            DEV_TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:devel"
            if [[ "${{ forgejo.ref }}" == refs/heads/beta ]]; then
              DEV_TAGS="$DEV_TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:beta"
            fi
          fi
          echo "prod_tags=$PROD_TAGS" >> "$FORGEJO_OUTPUT"
          echo "dev_tags=$DEV_TAGS" >> "$FORGEJO_OUTPUT"

      - name: Build and push devel image
        if: steps.tags.outputs.dev_tags != ''
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: docker/Dockerfile.dev
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.dev_tags }}
          build-args: |
            VERSION=${{ env.VERSION }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            BUILD_EPOCH=${{ env.BUILD_EPOCH }}
            COMMIT_ID=${{ env.COMMIT_ID }}
          labels: |
            maintainer=casjay <casjay@yahoo.com>
            org.opencontainers.image.vendor=apimgr
            org.opencontainers.image.authors=apimgr
            org.opencontainers.image.title=${{ env.PROJECTNAME }}
            org.opencontainers.image.base.name=${{ env.PROJECTNAME }}
            org.opencontainers.image.description=Privacy-respecting self-hosted metasearch engine
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.schema-version=${{ env.VERSION }}
            org.opencontainers.image.created=${{ env.BUILD_DATE }}
            org.opencontainers.image.revision=${{ env.COMMIT_ID }}
            org.opencontainers.image.url=${{ forgejo.server_url }}/${{ forgejo.repository }}
            org.opencontainers.image.source=${{ forgejo.server_url }}/${{ forgejo.repository }}
            org.opencontainers.image.documentation=${{ forgejo.server_url }}/${{ forgejo.repository }}
            org.opencontainers.image.vcs-type=Git
            org.opencontainers.image.licenses=MIT
            com.github.containers.toolbox=false
          annotations: |
            manifest:maintainer=casjay <casjay@yahoo.com>
            manifest:org.opencontainers.image.vendor=apimgr
            manifest:org.opencontainers.image.authors=apimgr
            manifest:org.opencontainers.image.title=${{ env.PROJECTNAME }}
            manifest:org.opencontainers.image.description=Privacy-respecting self-hosted metasearch engine
            manifest:org.opencontainers.image.version=${{ env.VERSION }}
            manifest:org.opencontainers.image.schema-version=${{ env.VERSION }}
            manifest:org.opencontainers.image.created=${{ env.BUILD_DATE }}
            manifest:org.opencontainers.image.revision=${{ env.COMMIT_ID }}
            manifest:org.opencontainers.image.url=${{ forgejo.server_url }}/${{ forgejo.repository }}
            manifest:org.opencontainers.image.source=${{ forgejo.server_url }}/${{ forgejo.repository }}
            manifest:org.opencontainers.image.documentation=${{ forgejo.server_url }}/${{ forgejo.repository }}
            manifest:org.opencontainers.image.vcs-type=Git
            manifest:org.opencontainers.image.licenses=MIT
            manifest:com.github.containers.toolbox=false
