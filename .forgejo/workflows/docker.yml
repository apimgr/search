name: Docker Build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
      - '*.*.*'
      - '*-beta'
  schedule:
    # 4am UTC daily — rebuild the devel image even without new commits
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ forgejo.ref }}
  cancel-in-progress: ${{ forgejo.ref == 'refs/heads/main' }}

env:
  PROJECTNAME: search
  IMAGE_NAME: ${{ forgejo.repository }}

jobs:
  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    if: forgejo.event_name != 'schedule'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Set registry from server URL
        run: |
          SERVER_URL="${{ forgejo.server_url }}"
          REGISTRY="${SERVER_URL#https://}"
          REGISTRY="${REGISTRY#http://}"
          echo "REGISTRY=${REGISTRY}" >> "$FORGEJO_ENV"

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ forgejo.actor }}
          password: ${{ secrets.FORGEJO_TOKEN }}

      - name: Set build info
        env:
          OFFICIAL_SITE_SECRET: ${{ secrets.OFFICIAL_SITE }}
        run: |
          echo "COMMIT_ID=$(git rev-parse --short=7 HEAD)" >> "$FORGEJO_ENV"
          echo "YYMM=$(date +"%y%m")" >> "$FORGEJO_ENV"
          if [[ "${{ forgejo.ref }}" == refs/tags/*-beta ]]; then
            VERSION="$FORGEJO_REF_NAME"
            if [[ ! "$VERSION" =~ ^[0-9]{14}-beta$ ]]; then
              echo "ERROR: beta tag must match YYYYMMDDHHMMSS-beta" >&2
              exit 2
            fi
            echo "VERSION=${VERSION}" >> "$FORGEJO_ENV"
            echo "IS_TAG=false" >> "$FORGEJO_ENV"
          elif [[ "${{ forgejo.ref }}" == refs/tags/* ]]; then
            VERSION="${FORGEJO_REF_NAME}"
            echo "VERSION=${VERSION#v}" >> "$FORGEJO_ENV"
            echo "IS_TAG=true" >> "$FORGEJO_ENV"
          else
            echo "VERSION=$(git rev-parse --short=7 HEAD)" >> "$FORGEJO_ENV"
            echo "IS_TAG=false" >> "$FORGEJO_ENV"
          fi
          EPOCH="$(date -u +%s)"
          echo "BUILD_EPOCH=${EPOCH}" >> "$FORGEJO_ENV"
          echo "BUILD_DATE=$(date -u -d @"${EPOCH}" +"%Y-%m-%dT%H:%M:%SZ")" >> "$FORGEJO_ENV"
          if [[ -f site.txt ]]; then OFFICIAL_SITE="$(cat site.txt)"; else OFFICIAL_SITE="${OFFICIAL_SITE_SECRET:-}"; fi
          echo "OFFICIAL_SITE=${OFFICIAL_SITE}" >> "$FORGEJO_ENV"

      - name: Determine tags
        id: tags
        run: |
          PROD_TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.COMMIT_ID }}"
          DEV_TAGS=""
          if [[ "${{ env.IS_TAG }}" == "true" ]]; then
            PROD_TAGS="$PROD_TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}"
            PROD_TAGS="$PROD_TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            PROD_TAGS="$PROD_TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.YYMM }}"
          elif [[ "${{ forgejo.ref }}" == refs/tags/*-beta ]]; then
            PROD_TAGS="$PROD_TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:beta"
          else
            DEV_TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:devel"
          fi
          echo "prod_tags=$PROD_TAGS" >> "$FORGEJO_OUTPUT"
          echo "dev_tags=$DEV_TAGS" >> "$FORGEJO_OUTPUT"

      - name: Generate OCI annotations
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          annotations: |
            maintainer=casjay <casjay@yahoo.com>
            org.opencontainers.image.vendor=apimgr
            org.opencontainers.image.authors=apimgr
            org.opencontainers.image.title=${{ env.PROJECTNAME }}
            org.opencontainers.image.base.name=${{ env.PROJECTNAME }}
            org.opencontainers.image.description=search - Privacy-respecting self-hosted metasearch engine
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.schema-version=${{ env.VERSION }}
            org.opencontainers.image.created=${{ env.BUILD_DATE }}
            org.opencontainers.image.revision=${{ env.COMMIT_ID }}
            org.opencontainers.image.url=${{ forgejo.server_url }}/${{ forgejo.repository }}
            org.opencontainers.image.source=${{ forgejo.server_url }}/${{ forgejo.repository }}
            org.opencontainers.image.documentation=${{ forgejo.server_url }}/${{ forgejo.repository }}
            org.opencontainers.image.vcs-type=Git
            org.opencontainers.image.licenses=MIT
            com.github.containers.toolbox=false

      - name: Build and push production image
        if: steps.tags.outputs.prod_tags != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.prod_tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ env.VERSION }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            BUILD_EPOCH=${{ env.BUILD_EPOCH }}
            COMMIT_ID=${{ env.COMMIT_ID }}
            OFFICIAL_SITE=${{ env.OFFICIAL_SITE }}
          labels: |
            maintainer=casjay <casjay@yahoo.com>
            org.opencontainers.image.vendor=apimgr
            org.opencontainers.image.authors=apimgr
            org.opencontainers.image.title=${{ env.PROJECTNAME }}
            org.opencontainers.image.base.name=${{ env.PROJECTNAME }}
            org.opencontainers.image.description=search - Privacy-respecting self-hosted metasearch engine
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.schema-version=${{ env.VERSION }}
            org.opencontainers.image.created=${{ env.BUILD_DATE }}
            org.opencontainers.image.revision=${{ env.COMMIT_ID }}
            org.opencontainers.image.url=${{ forgejo.server_url }}/${{ forgejo.repository }}
            org.opencontainers.image.source=${{ forgejo.server_url }}/${{ forgejo.repository }}
            org.opencontainers.image.documentation=${{ forgejo.server_url }}/${{ forgejo.repository }}
            org.opencontainers.image.vcs-type=Git
            org.opencontainers.image.licenses=MIT
            com.github.containers.toolbox=false

      - name: Verify production image runtime and Tor health
        if: steps.tags.outputs.prod_tags != ''
        run: |
          docker pull "${REGISTRY}/${IMAGE_NAME}:${COMMIT_ID}"
          bash tests/docker-image-check.sh "${REGISTRY}/${IMAGE_NAME}:${COMMIT_ID}"

  build-devel:
    name: Build and push devel image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Set registry from server URL
        run: |
          SERVER_URL="${{ forgejo.server_url }}"
          REGISTRY="${SERVER_URL#https://}"
          REGISTRY="${REGISTRY#http://}"
          echo "REGISTRY=${REGISTRY}" >> "$FORGEJO_ENV"

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ forgejo.actor }}
          password: ${{ secrets.FORGEJO_TOKEN }}

      - name: Set build info
        env:
          OFFICIAL_SITE_SECRET: ${{ secrets.OFFICIAL_SITE }}
        run: |
          echo "COMMIT_ID=$(git rev-parse --short=7 HEAD)" >> "$FORGEJO_ENV"
          echo "YYMM=$(date +"%y%m")" >> "$FORGEJO_ENV"
          if [[ "${{ forgejo.ref }}" == refs/tags/*-beta ]]; then
            VERSION="$FORGEJO_REF_NAME"
            if [[ ! "$VERSION" =~ ^[0-9]{14}-beta$ ]]; then
              echo "ERROR: beta tag must match YYYYMMDDHHMMSS-beta" >&2
              exit 2
            fi
            echo "VERSION=${VERSION}" >> "$FORGEJO_ENV"
            echo "IS_TAG=false" >> "$FORGEJO_ENV"
          elif [[ "${{ forgejo.ref }}" == refs/tags/* ]]; then
            VERSION="${FORGEJO_REF_NAME}"
            echo "VERSION=${VERSION#v}" >> "$FORGEJO_ENV"
            echo "IS_TAG=true" >> "$FORGEJO_ENV"
          else
            echo "VERSION=$(git rev-parse --short=7 HEAD)" >> "$FORGEJO_ENV"
            echo "IS_TAG=false" >> "$FORGEJO_ENV"
          fi
          EPOCH="$(date -u +%s)"
          echo "BUILD_EPOCH=${EPOCH}" >> "$FORGEJO_ENV"
          echo "BUILD_DATE=$(date -u -d @"${EPOCH}" +"%Y-%m-%dT%H:%M:%SZ")" >> "$FORGEJO_ENV"
          if [[ -f site.txt ]]; then OFFICIAL_SITE="$(cat site.txt)"; else OFFICIAL_SITE="${OFFICIAL_SITE_SECRET:-}"; fi
          echo "OFFICIAL_SITE=${OFFICIAL_SITE}" >> "$FORGEJO_ENV"

      - name: Determine tags
        id: tags
        run: |
          PROD_TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.COMMIT_ID }}"
          DEV_TAGS=""
          if [[ "${{ env.IS_TAG }}" == "true" ]]; then
            PROD_TAGS="$PROD_TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}"
            PROD_TAGS="$PROD_TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            PROD_TAGS="$PROD_TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.YYMM }}"
          elif [[ "${{ forgejo.ref }}" == refs/tags/*-beta ]]; then
            PROD_TAGS="$PROD_TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:beta"
          else
            DEV_TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:devel"
          fi
          echo "prod_tags=$PROD_TAGS" >> "$FORGEJO_OUTPUT"
          echo "dev_tags=$DEV_TAGS" >> "$FORGEJO_OUTPUT"

      - name: Generate OCI annotations
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          annotations: |
            maintainer=casjay <casjay@yahoo.com>
            org.opencontainers.image.vendor=apimgr
            org.opencontainers.image.authors=apimgr
            org.opencontainers.image.title=${{ env.PROJECTNAME }}
            org.opencontainers.image.base.name=${{ env.PROJECTNAME }}
            org.opencontainers.image.description=search - Privacy-respecting self-hosted metasearch engine
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.schema-version=${{ env.VERSION }}
            org.opencontainers.image.created=${{ env.BUILD_DATE }}
            org.opencontainers.image.revision=${{ env.COMMIT_ID }}
            org.opencontainers.image.url=${{ forgejo.server_url }}/${{ forgejo.repository }}
            org.opencontainers.image.source=${{ forgejo.server_url }}/${{ forgejo.repository }}
            org.opencontainers.image.documentation=${{ forgejo.server_url }}/${{ forgejo.repository }}
            org.opencontainers.image.vcs-type=Git
            org.opencontainers.image.licenses=MIT
            com.github.containers.toolbox=false

      - name: Build and push devel image
        if: steps.tags.outputs.dev_tags != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.dev
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.dev_tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ env.VERSION }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            BUILD_EPOCH=${{ env.BUILD_EPOCH }}
            COMMIT_ID=${{ env.COMMIT_ID }}
            OFFICIAL_SITE=${{ env.OFFICIAL_SITE }}
          labels: |
            maintainer=casjay <casjay@yahoo.com>
            org.opencontainers.image.vendor=apimgr
            org.opencontainers.image.authors=apimgr
            org.opencontainers.image.title=${{ env.PROJECTNAME }}
            org.opencontainers.image.base.name=${{ env.PROJECTNAME }}
            org.opencontainers.image.description=search - Privacy-respecting self-hosted metasearch engine
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.schema-version=${{ env.VERSION }}
            org.opencontainers.image.created=${{ env.BUILD_DATE }}
            org.opencontainers.image.revision=${{ env.COMMIT_ID }}
            org.opencontainers.image.url=${{ forgejo.server_url }}/${{ forgejo.repository }}
            org.opencontainers.image.source=${{ forgejo.server_url }}/${{ forgejo.repository }}
            org.opencontainers.image.documentation=${{ forgejo.server_url }}/${{ forgejo.repository }}
            org.opencontainers.image.vcs-type=Git
            org.opencontainers.image.licenses=MIT
            com.github.containers.toolbox=false

      - name: Verify devel image runtime and Tor health
        if: steps.tags.outputs.dev_tags != ''
        run: |
          docker pull "${REGISTRY}/${IMAGE_NAME}:devel"
          bash tests/docker-image-check.sh "${REGISTRY}/${IMAGE_NAME}:devel"
