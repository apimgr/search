# GitLab CI/CD Pipeline for search
# Equivalent to GitHub Actions: release.yml, beta.yml, devel.yml, docker.yml

variables:
  PROJECT_NAME: "search"
  PROJECT_ORG: "apimgr"
  CGO_ENABLED: "0"
  GIT_DEPTH: "0"
  GOOS: linux
  GOARCH: amd64
  # Go CI defaults to casjaysdev/go:latest — a docker/Dockerfile.build only for a genuine custom need, and then FROM casjaysdev/go:latest.
  BUILD_IMAGE: "casjaysdev/go:latest"

stages:
  - build
  - test
  - security
  - docker
  - package
  - release

# =============================================================================
# BUILD TEMPLATES
# =============================================================================

.go-build-template: &go-build
  image: $BUILD_IMAGE
  before_script:
    # NOTE: all tooling (git, bash, govulncheck, cyclonedx-gomod, etc.) is pre-installed
    # in casjaysdev/go:latest — never `apk add` or `go install` inside a CI job.
    - go mod download
    - go run ./src/cmd/apigen
    - if [ -f release.txt ]; then export VERSION="$(cat release.txt)"; else export VERSION="${CI_COMMIT_TAG#v}"; fi
    - export COMMIT_ID="${CI_COMMIT_SHA:0:7}"
    - export BUILD_EPOCH="$(date -u +%s)"
    - export BUILD_DATE="$(date -u -d @${BUILD_EPOCH} +"%Y-%m-%dT%H:%M:%SZ")"
    # OFFICIAL_SITE (optional): site.txt wins; otherwise use CI/CD Variables or leave empty
    # Never guess or assume - must be explicitly defined by user
    - |
      if [ -f site.txt ]; then
        export OFFICIAL_SITE="$(cat site.txt)"
      else
        export OFFICIAL_SITE="${OFFICIAL_SITE:-}"
      fi
    - export SERVER_LDFLAGS="-s -w -X 'github.com/apimgr/search/src/config.Version=${VERSION}' -X 'github.com/apimgr/search/src/config.CommitID=${COMMIT_ID}' -X 'github.com/apimgr/search/src/config.BuildEpoch=${BUILD_EPOCH}' -X 'github.com/apimgr/search/src/config.OfficialSite=${OFFICIAL_SITE}' -X 'github.com/apimgr/search/src/version.Version=${VERSION}' -X 'github.com/apimgr/search/src/version.CommitID=${COMMIT_ID}' -X 'github.com/apimgr/search/src/version.BuildEpoch=${BUILD_EPOCH}'"
    - export CLI_LDFLAGS="-s -w -X 'github.com/apimgr/search/src/client/cmd.ProjectName=${PROJECT_NAME}' -X 'github.com/apimgr/search/src/client/cmd.Version=${VERSION}' -X 'github.com/apimgr/search/src/client/cmd.CommitID=${COMMIT_ID}' -X 'github.com/apimgr/search/src/client/cmd.BuildEpoch=${BUILD_EPOCH}' -X 'github.com/apimgr/search/src/client/cmd.OfficialSite=${OFFICIAL_SITE}' -X 'github.com/apimgr/search/src/client/api.ProjectName=${PROJECT_NAME}' -X 'github.com/apimgr/search/src/client/api.Version=${VERSION}'"

# =============================================================================
# RELEASE BUILDS (Tag Push: v* or semver)
# =============================================================================

build:linux-amd64:
  <<: *go-build
  stage: build
  variables:
    GOOS: linux
    GOARCH: amd64
  script:
    - go build -buildvcs=false -trimpath -ldflags "${SERVER_LDFLAGS}" -o ${PROJECT_NAME}-linux-amd64 ./src
    - if [ -d "src/client" ]; then go build -buildvcs=false -trimpath -tags gui -ldflags "${CLI_LDFLAGS}" -o ${PROJECT_NAME}-cli-linux-amd64 ./src/client; fi
    # Export RELEASE_VERSION via dotenv for the release job (`needs` on this
    # job) - a job's declarative release: block can only see predefined CI
    # variables or dotenv exported by an UPSTREAM job, never its own; this
    # job only runs on tag pipelines (see rules: below) so CI_COMMIT_TAG is
    # always set here, but the guard keeps release.env empty on any other trigger
    - if [ -n "$CI_COMMIT_TAG" ]; then echo "RELEASE_VERSION=${VERSION}" > release.env; fi
  artifacts:
    paths:
      - ${PROJECT_NAME}-linux-amd64*
    reports:
      dotenv: release.env
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+/

