# =============================================================================
# TEST
# =============================================================================

test:
  <<: *go-build
  stage: test
  script:
    - mkdir -p "${TMPDIR:-/tmp}/${PROJECT_ORG}"
    - COVDIR=$(mktemp -d "${TMPDIR:-/tmp}/${PROJECT_ORG}/${PROJECT_NAME}-XXXXXX")
    - go test -v -cover -coverprofile="${COVDIR}/coverage.out" ./...
    - THRESHOLD=60
    - PCT=$(go tool cover -func="${COVDIR}/coverage.out" | awk '/^total:/ {gsub("%","",$3); print int($3)}')
    - if [ "$PCT" -lt "$THRESHOLD" ]; then echo "coverage ${PCT}% is below threshold ${THRESHOLD}%"; exit 1; fi
    - echo "Coverage: ${PCT}% (threshold: ${THRESHOLD}%)"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+/
    - if: $CI_COMMIT_BRANCH

lint:
  <<: *go-build
  stage: test
  script:
    - go vet ./...
    - staticcheck ./...
    - golangci-lint run
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

secret-scan:
  stage: security
  image: ghcr.io/trufflesecurity/trufflehog:3.99.0
  script:
    - trufflehog git file://. --no-update --results=verified,unknown
  rules:
    - when: always

workflow-policy:
  stage: security
  image: alpine:latest
  script:
    - |
      bad=$(grep -RnE '^[[:space:]]*uses:' .github/ .gitea/ .forgejo/ 2>/dev/null | grep -vE '@[0-9a-f]{40}([[:space:]]|$)' || true)
      if [ -n "$bad" ]; then
        echo "unpinned actions found:"
        echo "$bad"
        exit 1
      fi
  rules:
    - when: always

vuln-scan:
  <<: *go-build
  stage: security
  script:
    - govulncheck ./...
  rules:
    - exists:
        - go.sum

# =============================================================================
# RELEASE (GitLab Release)
# =============================================================================

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - build:linux-amd64
    - build:linux-arm64
    - build:darwin-amd64
    - build:darwin-arm64
    - build:windows-amd64
    - build:windows-arm64
    - build:freebsd-amd64
    - build:freebsd-arm64
    - sbom:release
    - test
    - lint
    - secret-scan
    - workflow-policy
    - vuln-scan
    - image-scan
  script:
    - echo "Creating release ${CI_COMMIT_TAG}"
    # RELEASE_VERSION comes from build:linux-amd64's dotenv (`needs` above) -
    # a job's declarative release: block can only see predefined CI variables
    # or dotenv exported by an UPSTREAM job, never its own, so this can't be
    # self-exported here; it's also unusable for shell parameter expansion
    # (${CI_COMMIT_TAG#v}) directly in that block, which is why the upstream
    # job pre-strips the `v` prefix before exporting
    - echo "${RELEASE_VERSION}" > version.txt
    # Source archive - the job runs in the full repo checkout (not an isolated
    # directory), so already-staged release assets (binaries, sbom, checksums)
    # are excluded to avoid archiving our own output
    - >
      tar --exclude='.git' --exclude='${PROJECT_NAME}-*' --exclude='version.txt'
      --exclude='sha256.txt' --exclude='sha512.txt'
      -czf ${PROJECT_NAME}-${RELEASE_VERSION}-source.tar.gz .
    # Consolidated sha256.txt/sha512.txt over every release asset (version.txt +
    # binaries + the SBOM pulled in via `needs: sbom:release` + the source
    # archive above, all matching the ${PROJECT_NAME}-* glob) - the job runs in
    # the full repo checkout, not an isolated directory, so the file list is
    # explicitly scoped rather than a bare `ls`; pre-capturing it once (GitLab
    # concatenates script items into one shell, so the var carries) ensures
    # both checksum files cover the identical asset set and never hash each
    # other or themselves
    - FILES="version.txt ${PROJECT_NAME}-*"
    - sha256sum $FILES > sha256.txt
    - sha512sum $FILES > sha512.txt
  artifacts:
    paths:
      - version.txt
      - sha256.txt
      - sha512.txt
      - ${PROJECT_NAME}-*
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: "Release created by GitLab CI"
    assets:
      links:
        - name: "${PROJECT_NAME}-linux-amd64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/${PROJECT_NAME}-linux-amd64?job=build:linux-amd64"
        - name: "${PROJECT_NAME}-linux-arm64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/${PROJECT_NAME}-linux-arm64?job=build:linux-arm64"
        - name: "${PROJECT_NAME}-darwin-amd64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/${PROJECT_NAME}-darwin-amd64?job=build:darwin-amd64"
        - name: "${PROJECT_NAME}-darwin-arm64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/${PROJECT_NAME}-darwin-arm64?job=build:darwin-arm64"
        - name: "${PROJECT_NAME}-windows-amd64.exe"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/${PROJECT_NAME}-windows-amd64.exe?job=build:windows-amd64"
        - name: "${PROJECT_NAME}-windows-arm64.exe"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/${PROJECT_NAME}-windows-arm64.exe?job=build:windows-arm64"
        - name: "${PROJECT_NAME}-freebsd-amd64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/${PROJECT_NAME}-freebsd-amd64?job=build:freebsd-amd64"
        - name: "${PROJECT_NAME}-freebsd-arm64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/${PROJECT_NAME}-freebsd-arm64?job=build:freebsd-arm64"
        - name: "${PROJECT_NAME}-${RELEASE_VERSION}-sbom.cdx.json"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/${PROJECT_NAME}-${RELEASE_VERSION}-sbom.cdx.json?job=release"
        - name: "${PROJECT_NAME}-${RELEASE_VERSION}-source.tar.gz"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/${PROJECT_NAME}-${RELEASE_VERSION}-source.tar.gz?job=release"
        - name: "sha256.txt"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/sha256.txt?job=release"
        - name: "sha512.txt"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/sha512.txt?job=release"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+/

# =============================================================================
# BETA BUILDS (Push to beta branch)
# =============================================================================

build:beta:
  <<: *go-build
  stage: build
  before_script:
    # All tooling is pre-installed in casjaysdev/go:latest — never `apk add` in a CI job
    - go mod download
    - go run ./src/cmd/apigen
    - export VERSION="$(date +%Y%m%d%H%M%S)-beta"
    - export COMMIT_ID="${CI_COMMIT_SHA:0:7}"
    - export BUILD_EPOCH="$(date -u +%s)"
    - export BUILD_DATE="$(date -u -d @${BUILD_EPOCH} +"%Y-%m-%dT%H:%M:%SZ")"
    - if [ -f site.txt ]; then export OFFICIAL_SITE="$(cat site.txt)"; else export OFFICIAL_SITE="${OFFICIAL_SITE:-}"; fi
    - export SERVER_LDFLAGS="-s -w -X 'github.com/apimgr/search/src/config.Version=${VERSION}' -X 'github.com/apimgr/search/src/config.CommitID=${COMMIT_ID}' -X 'github.com/apimgr/search/src/config.BuildEpoch=${BUILD_EPOCH}' -X 'github.com/apimgr/search/src/config.OfficialSite=${OFFICIAL_SITE}' -X 'github.com/apimgr/search/src/version.Version=${VERSION}' -X 'github.com/apimgr/search/src/version.CommitID=${COMMIT_ID}' -X 'github.com/apimgr/search/src/version.BuildEpoch=${BUILD_EPOCH}'"
    - export CLI_LDFLAGS="-s -w -X 'github.com/apimgr/search/src/client/cmd.ProjectName=${PROJECT_NAME}' -X 'github.com/apimgr/search/src/client/cmd.Version=${VERSION}' -X 'github.com/apimgr/search/src/client/cmd.CommitID=${COMMIT_ID}' -X 'github.com/apimgr/search/src/client/cmd.BuildEpoch=${BUILD_EPOCH}' -X 'github.com/apimgr/search/src/client/cmd.OfficialSite=${OFFICIAL_SITE}' -X 'github.com/apimgr/search/src/client/api.ProjectName=${PROJECT_NAME}' -X 'github.com/apimgr/search/src/client/api.Version=${VERSION}'"
  script:
    # Build all 8 platforms
    - GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${SERVER_LDFLAGS}" -o ${PROJECT_NAME}-linux-amd64 ./src
    - GOOS=linux GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "${SERVER_LDFLAGS}" -o ${PROJECT_NAME}-linux-arm64 ./src
    - GOOS=darwin GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${SERVER_LDFLAGS}" -o ${PROJECT_NAME}-darwin-amd64 ./src
    - GOOS=darwin GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "${SERVER_LDFLAGS}" -o ${PROJECT_NAME}-darwin-arm64 ./src
    - GOOS=windows GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${SERVER_LDFLAGS}" -o ${PROJECT_NAME}-windows-amd64.exe ./src
    - GOOS=windows GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "${SERVER_LDFLAGS}" -o ${PROJECT_NAME}-windows-arm64.exe ./src
    - GOOS=freebsd GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${SERVER_LDFLAGS}" -o ${PROJECT_NAME}-freebsd-amd64 ./src
    - GOOS=freebsd GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "${SERVER_LDFLAGS}" -o ${PROJECT_NAME}-freebsd-arm64 ./src
    # Build CLI if exists
    - if [ -d "src/client" ]; then GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -tags gui -ldflags "${CLI_LDFLAGS}" -o ${PROJECT_NAME}-cli-linux-amd64 ./src/client; fi
    - if [ -d "src/client" ]; then GOOS=linux GOARCH=arm64 go build -buildvcs=false -trimpath -tags gui -ldflags "${CLI_LDFLAGS}" -o ${PROJECT_NAME}-cli-linux-arm64 ./src/client; fi
    - if [ -d "src/client" ]; then GOOS=darwin GOARCH=amd64 go build -buildvcs=false -trimpath -tags gui -ldflags "${CLI_LDFLAGS}" -o ${PROJECT_NAME}-cli-darwin-amd64 ./src/client; fi
    - if [ -d "src/client" ]; then GOOS=darwin GOARCH=arm64 go build -buildvcs=false -trimpath -tags gui -ldflags "${CLI_LDFLAGS}" -o ${PROJECT_NAME}-cli-darwin-arm64 ./src/client; fi
    - if [ -d "src/client" ]; then GOOS=windows GOARCH=amd64 go build -buildvcs=false -trimpath -tags gui -ldflags "${CLI_LDFLAGS}" -o ${PROJECT_NAME}-cli-windows-amd64.exe ./src/client; fi
    - if [ -d "src/client" ]; then GOOS=windows GOARCH=arm64 go build -buildvcs=false -trimpath -tags gui -ldflags "${CLI_LDFLAGS}" -o ${PROJECT_NAME}-cli-windows-arm64.exe ./src/client; fi
    - if [ -d "src/client" ]; then GOOS=freebsd GOARCH=amd64 go build -buildvcs=false -trimpath -tags gui -ldflags "${CLI_LDFLAGS}" -o ${PROJECT_NAME}-cli-freebsd-amd64 ./src/client; fi
    - if [ -d "src/client" ]; then GOOS=freebsd GOARCH=arm64 go build -buildvcs=false -trimpath -tags gui -ldflags "${CLI_LDFLAGS}" -o ${PROJECT_NAME}-cli-freebsd-arm64 ./src/client; fi
    # Build Agent if exists
    # Export VERSION via dotenv so release:beta (which creates version.txt,
    # checksums, and the GitLab Release) never recomputes the timestamp - the
    # release tag always matches the identity embedded in these binaries
    - echo "RELEASE_VERSION=${VERSION}" > release.env
  artifacts:
    paths:
      - ${PROJECT_NAME}-*
    reports:
      dotenv: release.env
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "beta"

# =============================================================================
# DEVEL BUILDS (Scheduled + main/master push) - All 8 platforms
# =============================================================================

build:devel:
  <<: *go-build
  stage: build
  before_script:
    # All tooling is pre-installed in casjaysdev/go:latest — never `apk add` in a CI job
    # Devel identity is the commit being built, not a timestamp
    - export VERSION="${CI_COMMIT_SHA:0:7}"
    - export COMMIT_ID="${CI_COMMIT_SHA:0:7}"
    - export BUILD_EPOCH="$(date -u +%s)"
    - export BUILD_DATE="$(date -u -d @${BUILD_EPOCH} +"%Y-%m-%dT%H:%M:%SZ")"
    - if [ -f site.txt ]; then export OFFICIAL_SITE="$(cat site.txt)"; else export OFFICIAL_SITE="${OFFICIAL_SITE:-}"; fi
    - go mod download
    - go run ./src/cmd/apigen
    - export SERVER_LDFLAGS="-s -w -X 'github.com/apimgr/search/src/config.Version=${VERSION}' -X 'github.com/apimgr/search/src/config.CommitID=${COMMIT_ID}' -X 'github.com/apimgr/search/src/config.BuildEpoch=${BUILD_EPOCH}' -X 'github.com/apimgr/search/src/config.OfficialSite=${OFFICIAL_SITE}' -X 'github.com/apimgr/search/src/version.Version=${VERSION}' -X 'github.com/apimgr/search/src/version.CommitID=${COMMIT_ID}' -X 'github.com/apimgr/search/src/version.BuildEpoch=${BUILD_EPOCH}'"
    - export CLI_LDFLAGS="-s -w -X 'github.com/apimgr/search/src/client/cmd.ProjectName=${PROJECT_NAME}' -X 'github.com/apimgr/search/src/client/cmd.Version=${VERSION}' -X 'github.com/apimgr/search/src/client/cmd.CommitID=${COMMIT_ID}' -X 'github.com/apimgr/search/src/client/cmd.BuildEpoch=${BUILD_EPOCH}' -X 'github.com/apimgr/search/src/client/cmd.OfficialSite=${OFFICIAL_SITE}' -X 'github.com/apimgr/search/src/client/api.ProjectName=${PROJECT_NAME}' -X 'github.com/apimgr/search/src/client/api.Version=${VERSION}'"
  script:
    # Build all 8 platforms
    - GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${SERVER_LDFLAGS}" -o ${PROJECT_NAME}-linux-amd64 ./src
    - GOOS=linux GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "${SERVER_LDFLAGS}" -o ${PROJECT_NAME}-linux-arm64 ./src
    - GOOS=darwin GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${SERVER_LDFLAGS}" -o ${PROJECT_NAME}-darwin-amd64 ./src
    - GOOS=darwin GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "${SERVER_LDFLAGS}" -o ${PROJECT_NAME}-darwin-arm64 ./src
    - GOOS=windows GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${SERVER_LDFLAGS}" -o ${PROJECT_NAME}-windows-amd64.exe ./src
    - GOOS=windows GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "${SERVER_LDFLAGS}" -o ${PROJECT_NAME}-windows-arm64.exe ./src
    - GOOS=freebsd GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${SERVER_LDFLAGS}" -o ${PROJECT_NAME}-freebsd-amd64 ./src
    - GOOS=freebsd GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "${SERVER_LDFLAGS}" -o ${PROJECT_NAME}-freebsd-arm64 ./src
    # Build CLI if exists
    - if [ -d "src/client" ]; then GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -tags gui -ldflags "${CLI_LDFLAGS}" -o ${PROJECT_NAME}-cli-linux-amd64 ./src/client; fi
    - if [ -d "src/client" ]; then GOOS=linux GOARCH=arm64 go build -buildvcs=false -trimpath -tags gui -ldflags "${CLI_LDFLAGS}" -o ${PROJECT_NAME}-cli-linux-arm64 ./src/client; fi
    - if [ -d "src/client" ]; then GOOS=darwin GOARCH=amd64 go build -buildvcs=false -trimpath -tags gui -ldflags "${CLI_LDFLAGS}" -o ${PROJECT_NAME}-cli-darwin-amd64 ./src/client; fi
    - if [ -d "src/client" ]; then GOOS=darwin GOARCH=arm64 go build -buildvcs=false -trimpath -tags gui -ldflags "${CLI_LDFLAGS}" -o ${PROJECT_NAME}-cli-darwin-arm64 ./src/client; fi
    - if [ -d "src/client" ]; then GOOS=windows GOARCH=amd64 go build -buildvcs=false -trimpath -tags gui -ldflags "${CLI_LDFLAGS}" -o ${PROJECT_NAME}-cli-windows-amd64.exe ./src/client; fi
    - if [ -d "src/client" ]; then GOOS=windows GOARCH=arm64 go build -buildvcs=false -trimpath -tags gui -ldflags "${CLI_LDFLAGS}" -o ${PROJECT_NAME}-cli-windows-arm64.exe ./src/client; fi
    - if [ -d "src/client" ]; then GOOS=freebsd GOARCH=amd64 go build -buildvcs=false -trimpath -tags gui -ldflags "${CLI_LDFLAGS}" -o ${PROJECT_NAME}-cli-freebsd-amd64 ./src/client; fi
    - if [ -d "src/client" ]; then GOOS=freebsd GOARCH=arm64 go build -buildvcs=false -trimpath -tags gui -ldflags "${CLI_LDFLAGS}" -o ${PROJECT_NAME}-cli-freebsd-arm64 ./src/client; fi
    # Build Agent if exists
  artifacts:
    paths:
      - ${PROJECT_NAME}-*
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
      when: manual
      allow_failure: true

# =============================================================================
# SBOM (CycloneDX) - one job per channel so the SBOM file name matches that
# channel's version identity; cyclonedx-gomod is pre-installed in $BUILD_IMAGE
# (release-cli, used by the release jobs below, has no Docker/toolchain access)
# =============================================================================

sbom:release:
  image: $BUILD_IMAGE
  stage: package
  needs:
    - test
  before_script:
    - export VERSION="${CI_COMMIT_TAG#v}"
  script:
    - cyclonedx-gomod mod -json -output "${PROJECT_NAME}-${VERSION}-sbom.cdx.json"
  artifacts:
    paths:
      - ${PROJECT_NAME}-*-sbom.cdx.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+/

sbom:beta:
  image: $BUILD_IMAGE
  stage: package
  needs:
    # Pulls in RELEASE_VERSION via dotenv so the SBOM file name matches the
    # version embedded in build:beta's binaries - never recomputed here
    - build:beta
  script:
    - cyclonedx-gomod mod -json -output "${PROJECT_NAME}-${RELEASE_VERSION}-sbom.cdx.json"
  artifacts:
    paths:
      - ${PROJECT_NAME}-*-sbom.cdx.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "beta"

sbom:devel:
  image: $BUILD_IMAGE
  stage: package
  needs:
    - test
  before_script:
    # Devel identity is the commit, not a timestamp - matches build:devel
    - export VERSION="${CI_COMMIT_SHA:0:7}"
  script:
    - cyclonedx-gomod mod -json -output "${PROJECT_NAME}-${VERSION}-sbom.cdx.json"
  artifacts:
    paths:
      - ${PROJECT_NAME}-*-sbom.cdx.json
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
      when: manual
      allow_failure: true

# =============================================================================
# RELEASE PUBLISH (Beta + Devel) - real GitLab Release objects, mirroring the
# stable release job above (source archive + SBOM + checksums, in that order)
# =============================================================================

release:beta:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - build:beta
    - sbom:beta
    - test
    - lint
    - secret-scan
    - workflow-policy
    - vuln-scan
    - image-scan
  script:
    # VERSION comes from build:beta's dotenv (RELEASE_VERSION) - never
    # recomputed here, so the release tag always matches the identity
    # embedded in the binaries
    - echo "${RELEASE_VERSION}" > version.txt
    # Source archive - already-staged release assets (binaries, sbom,
    # checksums) are excluded to avoid archiving our own output
    - >
      tar --exclude='.git' --exclude='${PROJECT_NAME}-*' --exclude='version.txt'
      --exclude='sha256.txt' --exclude='sha512.txt'
      -czf ${PROJECT_NAME}-${RELEASE_VERSION}-source.tar.gz .
    - FILES="version.txt ${PROJECT_NAME}-*"
    - sha256sum $FILES > sha256.txt
    - sha512sum $FILES > sha512.txt
  artifacts:
    paths:
      - version.txt
      - sha256.txt
      - sha512.txt
      - ${PROJECT_NAME}-*
    expire_in: 1 week
  release:
    tag_name: "$RELEASE_VERSION"
    name: "Beta $RELEASE_VERSION"
    description: "Beta release created by GitLab CI"
    assets:
      links:
        - name: "${PROJECT_NAME}-linux-amd64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/${PROJECT_NAME}-linux-amd64?job=build:beta"
        - name: "${PROJECT_NAME}-linux-arm64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/${PROJECT_NAME}-linux-arm64?job=build:beta"
        - name: "${PROJECT_NAME}-darwin-amd64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/${PROJECT_NAME}-darwin-amd64?job=build:beta"
        - name: "${PROJECT_NAME}-darwin-arm64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/${PROJECT_NAME}-darwin-arm64?job=build:beta"
        - name: "${PROJECT_NAME}-windows-amd64.exe"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/${PROJECT_NAME}-windows-amd64.exe?job=build:beta"
        - name: "${PROJECT_NAME}-windows-arm64.exe"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/${PROJECT_NAME}-windows-arm64.exe?job=build:beta"
        - name: "${PROJECT_NAME}-freebsd-amd64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/${PROJECT_NAME}-freebsd-amd64?job=build:beta"
        - name: "${PROJECT_NAME}-freebsd-arm64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/${PROJECT_NAME}-freebsd-arm64?job=build:beta"
        - name: "${PROJECT_NAME}-${RELEASE_VERSION}-sbom.cdx.json"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/${PROJECT_NAME}-${RELEASE_VERSION}-sbom.cdx.json?job=release:beta"
        - name: "${PROJECT_NAME}-${RELEASE_VERSION}-source.tar.gz"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/${PROJECT_NAME}-${RELEASE_VERSION}-source.tar.gz?job=release:beta"
        - name: "sha256.txt"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/sha256.txt?job=release:beta"
        - name: "sha512.txt"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/sha512.txt?job=release:beta"
  rules:
    - if: $CI_COMMIT_BRANCH == "beta"

release:devel:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - build:devel
    - sbom:devel
    - test
    - lint
    - secret-scan
    - workflow-policy
    - vuln-scan
    - image-scan
  before_script:
    # Delete previous rolling devel release + tag via GitLab Releases API
    - >
      curl --request DELETE --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}"
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/devel" || true
    - >
      curl --request DELETE --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}"
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/tags/devel" || true
  script:
    # Devel identity is the commit, not a timestamp - matches build:devel
    - echo "${CI_COMMIT_SHA:0:7}" > version.txt
    # Source archive - already-staged release assets (binaries, sbom,
    # checksums) are excluded to avoid archiving our own output
    - >
      tar --exclude='.git' --exclude='${PROJECT_NAME}-*' --exclude='version.txt'
      --exclude='sha256.txt' --exclude='sha512.txt'
      -czf ${PROJECT_NAME}-${CI_COMMIT_SHA:0:7}-source.tar.gz .
    - FILES="version.txt ${PROJECT_NAME}-*"
    - sha256sum $FILES > sha256.txt
    - sha512sum $FILES > sha512.txt
  artifacts:
    paths:
      - version.txt
      - sha256.txt
      - sha512.txt
      - ${PROJECT_NAME}-*
    expire_in: 1 day
  release:
    tag_name: "devel"
    name: "Devel Build ${CI_COMMIT_SHA:0:7}"
    description: "Devel build: ${CI_COMMIT_SHA:0:7}"
    assets:
      links:
        - name: "${PROJECT_NAME}-linux-amd64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_SHA}/raw/${PROJECT_NAME}-linux-amd64?job=build:devel"
        - name: "${PROJECT_NAME}-linux-arm64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_SHA}/raw/${PROJECT_NAME}-linux-arm64?job=build:devel"
        - name: "${PROJECT_NAME}-darwin-amd64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_SHA}/raw/${PROJECT_NAME}-darwin-amd64?job=build:devel"
        - name: "${PROJECT_NAME}-darwin-arm64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_SHA}/raw/${PROJECT_NAME}-darwin-arm64?job=build:devel"
        - name: "${PROJECT_NAME}-windows-amd64.exe"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_SHA}/raw/${PROJECT_NAME}-windows-amd64.exe?job=build:devel"
        - name: "${PROJECT_NAME}-windows-arm64.exe"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_SHA}/raw/${PROJECT_NAME}-windows-arm64.exe?job=build:devel"
        - name: "${PROJECT_NAME}-freebsd-amd64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_SHA}/raw/${PROJECT_NAME}-freebsd-amd64?job=build:devel"
        - name: "${PROJECT_NAME}-freebsd-arm64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_SHA}/raw/${PROJECT_NAME}-freebsd-arm64?job=build:devel"
        - name: "${PROJECT_NAME}-${CI_COMMIT_SHA:0:7}-sbom.cdx.json"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_SHA}/raw/${PROJECT_NAME}-${CI_COMMIT_SHA:0:7}-sbom.cdx.json?job=release:devel"
        - name: "${PROJECT_NAME}-${CI_COMMIT_SHA:0:7}-source.tar.gz"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_SHA}/raw/${PROJECT_NAME}-${CI_COMMIT_SHA:0:7}-source.tar.gz?job=release:devel"
        - name: "sha256.txt"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_SHA}/raw/sha256.txt?job=release:devel"
        - name: "sha512.txt"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_SHA}/raw/sha512.txt?job=release:devel"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
      when: manual
      allow_failure: true

# =============================================================================
# DOCKER BUILDS
# =============================================================================

docker:build:
  stage: docker
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT: "1"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker buildx create --name multiarch-builder --use 2>/dev/null || docker buildx use multiarch-builder
  script:
    - |
      # Determine version and tags based on trigger
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
        YYMM=$(date +%y%m)
        TAGS="-t $CI_REGISTRY_IMAGE:$VERSION -t $CI_REGISTRY_IMAGE:latest -t $CI_REGISTRY_IMAGE:$YYMM -t $CI_REGISTRY_IMAGE:${CI_COMMIT_SHA:0:7}"
      elif [ "$CI_COMMIT_BRANCH" = "beta" ]; then
        VERSION="beta-${CI_COMMIT_SHA:0:7}"
        TAGS="-t $CI_REGISTRY_IMAGE:beta -t $CI_REGISTRY_IMAGE:${CI_COMMIT_SHA:0:7}"
      else
        VERSION="${CI_COMMIT_SHA:0:7}"
        TAGS="-t $CI_REGISTRY_IMAGE:${CI_COMMIT_SHA:0:7}"
      fi
      BUILD_EPOCH="$(date -u +%s)"
      BUILD_DATE="$(date -u -d @${BUILD_EPOCH} +"%Y-%m-%dT%H:%M:%SZ")"
    - |
      # Build multi-arch with OCI labels and manifest annotations
      docker buildx build \
        -f docker/Dockerfile \
        --platform linux/amd64,linux/arm64 \
        --build-arg VERSION="${VERSION}" \
        --build-arg COMMIT_ID="${CI_COMMIT_SHA:0:7}" \
        --build-arg BUILD_DATE="${BUILD_DATE}" \
        --build-arg BUILD_EPOCH="${BUILD_EPOCH}" \
        --label "org.opencontainers.image.vendor=${PROJECT_ORG}" \
        --label "org.opencontainers.image.authors=${PROJECT_ORG}" \
        --label "org.opencontainers.image.title=${PROJECT_NAME}" \
        --label "org.opencontainers.image.base.name=${PROJECT_NAME}" \
        --label "org.opencontainers.image.description=${PROJECT_NAME} - standard image (alpine)" \
        --label "org.opencontainers.image.licenses=MIT" \
        --label "org.opencontainers.image.version=${VERSION}" \
        --label "org.opencontainers.image.created=${BUILD_DATE}" \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA:0:7}" \
        --label "org.opencontainers.image.url=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.documentation=${CI_PROJECT_URL}" \
        --annotation "manifest:org.opencontainers.image.vendor=${PROJECT_ORG}" \
        --annotation "manifest:org.opencontainers.image.authors=${PROJECT_ORG}" \
        --annotation "manifest:org.opencontainers.image.title=${PROJECT_NAME}" \
        --annotation "manifest:org.opencontainers.image.base.name=${PROJECT_NAME}" \
        --annotation "manifest:org.opencontainers.image.description=${PROJECT_NAME} - standard image (alpine)" \
        --annotation "manifest:org.opencontainers.image.licenses=MIT" \
        --annotation "manifest:org.opencontainers.image.version=${VERSION}" \
        --annotation "manifest:org.opencontainers.image.created=${BUILD_DATE}" \
        --annotation "manifest:org.opencontainers.image.revision=${CI_COMMIT_SHA:0:7}" \
        --annotation "manifest:org.opencontainers.image.url=${CI_PROJECT_URL}" \
        --annotation "manifest:org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --annotation "manifest:org.opencontainers.image.documentation=${CI_PROJECT_URL}" \
        $TAGS \
        --push \
        .
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+/
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "beta"

# =============================================================================
# DEVEL IMAGE BUILD (own job — push to any branch + daily schedule)
# =============================================================================
# :devel is never built by docker:build above — Dockerfile.dev is built here,
# on every push (excluding tags) and once devel via a scheduled pipeline, so a
# broken Dockerfile.dev can never block the release docker:build job. MODE=devel
# is baked into Dockerfile.dev via ENV — no extra build-arg needed here.

docker:devel:
  stage: docker
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT: "1"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker buildx create --name multiarch-builder --use 2>/dev/null || docker buildx use multiarch-builder
  script:
    - |
      BUILD_EPOCH="$(date -u +%s)"
      BUILD_DATE="$(date -u -d @${BUILD_EPOCH} +"%Y-%m-%dT%H:%M:%SZ")"
    - |
      docker buildx build \
        -f docker/Dockerfile.dev \
        --platform linux/amd64,linux/arm64 \
        --build-arg COMMIT_ID="${CI_COMMIT_SHA:0:7}" \
        --build-arg BUILD_DATE="${BUILD_DATE}" \
        --build-arg BUILD_EPOCH="${BUILD_EPOCH}" \
        --label "org.opencontainers.image.vendor=${PROJECT_ORG}" \
        --label "org.opencontainers.image.authors=${PROJECT_ORG}" \
        --label "org.opencontainers.image.title=${PROJECT_NAME}" \
        --label "org.opencontainers.image.base.name=${PROJECT_NAME}" \
        --label "org.opencontainers.image.description=${PROJECT_NAME} - development image (alpine, debug mode)" \
        --label "org.opencontainers.image.licenses=MIT" \
        --label "org.opencontainers.image.created=${BUILD_DATE}" \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA:0:7}" \
        --label "org.opencontainers.image.url=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.documentation=${CI_PROJECT_URL}" \
        --annotation "manifest:org.opencontainers.image.vendor=${PROJECT_ORG}" \
        --annotation "manifest:org.opencontainers.image.authors=${PROJECT_ORG}" \
        --annotation "manifest:org.opencontainers.image.title=${PROJECT_NAME}" \
        --annotation "manifest:org.opencontainers.image.base.name=${PROJECT_NAME}" \
        --annotation "manifest:org.opencontainers.image.description=${PROJECT_NAME} - development image (alpine, debug mode)" \
        --annotation "manifest:org.opencontainers.image.licenses=MIT" \
        --annotation "manifest:org.opencontainers.image.created=${BUILD_DATE}" \
        --annotation "manifest:org.opencontainers.image.revision=${CI_COMMIT_SHA:0:7}" \
        --annotation "manifest:org.opencontainers.image.url=${CI_PROJECT_URL}" \
        --annotation "manifest:org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --annotation "manifest:org.opencontainers.image.documentation=${CI_PROJECT_URL}" \
        -t $CI_REGISTRY_IMAGE:devel \
        --push \
        .
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success

image-scan:
  stage: docker
  image: ghcr.io/aquasecurity/trivy:0.76.1
  needs:
    - job: docker:build
      optional: true
    - job: docker:devel
      optional: true
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ] || [ "$CI_COMMIT_BRANCH" = "main" ] || [ "$CI_COMMIT_BRANCH" = "master" ] || [ "$CI_COMMIT_BRANCH" = "beta" ]; then
        IMAGE_TAG="${CI_COMMIT_SHA:0:7}"
      else
        IMAGE_TAG="devel"
      fi
      trivy image --username "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" --exit-code 1 --severity CRITICAL,HIGH "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
