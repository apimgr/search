name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  schedule:
    # Weekly security run (Monday 06:00 UTC) — only security jobs run on schedule
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECTNAME: search
  PROJECTORG: apimgr

jobs:
  test:
    name: Test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    env:
      CGO_ENABLED: "0"
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Run tests with coverage
        run: |
          mkdir -p "/tmp/${PROJECTORG}"
          COVDIR=$(mktemp -d "/tmp/${PROJECTORG}/${PROJECTNAME}-XXXXXX")
          go mod download
          go run ./src/cmd/apigen
          go test -cover -coverprofile="${COVDIR}/coverage.out" ./...
          THRESHOLD=60
          PCT=$(go tool cover -func="${COVDIR}/coverage.out" | awk '/^total:/ {gsub("%","",$3); print int($3)}')
          if [ "$PCT" -lt "$THRESHOLD" ]; then
            echo "::error::coverage ${PCT}% is below threshold ${THRESHOLD}%"
            exit 1
          fi
          echo "Coverage: ${PCT}% (threshold: ${THRESHOLD}%)"

  lint:
    name: Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    env:
      CGO_ENABLED: "0"
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: go vet
        run: |
          go mod download
          go run ./src/cmd/apigen
          go vet ./...

      - name: staticcheck
        run: |
          go mod download
          go run ./src/cmd/apigen
          staticcheck ./...

      - name: golangci-lint
        run: |
          golangci-lint run

  build:
    name: Build
    if: github.event_name != 'schedule'
    needs: [test, lint]
    runs-on: ubuntu-latest
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    env:
      CGO_ENABLED: "0"
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set build info
        run: |
          echo "VERSION=$(cat release.txt 2>/dev/null || echo "devel")" >> "$GITHUB_ENV"
          echo "COMMIT_ID=$(git rev-parse --short=7 HEAD 2>/dev/null || echo "unknown")" >> "$GITHUB_ENV"
          echo "BUILD_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"
          if [ -f site.txt ]; then
            echo "OFFICIALSITE=$(cat site.txt)" >> "$GITHUB_ENV"
          else
            echo "OFFICIALSITE=${{ secrets.OFFICIALSITE }}" >> "$GITHUB_ENV"
          fi

      - name: Build binaries
        run: |
          go mod download
          go run ./src/cmd/apigen
          LDFLAGS="-s -w \
            -X 'github.com/apimgr/search/src/config.Version=${VERSION}' \
            -X 'github.com/apimgr/search/src/config.CommitID=${COMMIT_ID}' \
            -X 'github.com/apimgr/search/src/config.BuildEpoch=${BUILD_EPOCH}' \
            -X 'github.com/apimgr/search/src/config.OfficialSite=${OFFICIALSITE}' \
            -X 'github.com/apimgr/search/src/version.Version=${VERSION}' \
            -X 'github.com/apimgr/search/src/version.CommitID=${COMMIT_ID}' \
            -X 'github.com/apimgr/search/src/version.BuildEpoch=${BUILD_EPOCH}'"
          CLI_LDFLAGS="-s -w \
            -X 'github.com/apimgr/search/src/client/cmd.ProjectName=${PROJECTNAME}' \
            -X 'github.com/apimgr/search/src/client/cmd.Version=${VERSION}' \
            -X 'github.com/apimgr/search/src/client/cmd.CommitID=${COMMIT_ID}' \
            -X 'github.com/apimgr/search/src/client/cmd.BuildEpoch=${BUILD_EPOCH}' \
            -X 'github.com/apimgr/search/src/client/cmd.OfficialSite=${OFFICIALSITE}' \
            -X 'github.com/apimgr/search/src/client/api.ProjectName=${PROJECTNAME}' \
            -X 'github.com/apimgr/search/src/client/api.Version=${VERSION}'"
          GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath \
            -ldflags "$LDFLAGS" -o /tmp/search-linux-amd64 ./src
          GOOS=linux GOARCH=arm64 go build -buildvcs=false -trimpath \
            -ldflags "$LDFLAGS" -o /tmp/search-linux-arm64 ./src
          if [ -d src/client ]; then
            GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -tags gui \
              -ldflags "$CLI_LDFLAGS" -o /tmp/search-cli-linux-amd64 ./src/client
            GOOS=linux GOARCH=arm64 go build -buildvcs=false -trimpath -tags gui \
              -ldflags "$CLI_LDFLAGS" -o /tmp/search-cli-linux-arm64 ./src/client
          fi
          echo "Build OK"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      # Empty base/head = full-history scan (schedule runs and new-branch pushes)
      - name: Determine scan range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE=""; HEAD=""
          if [ "$EVENT_NAME" = "push" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            BASE="$EVENT_BEFORE"; HEAD="$EVENT_SHA"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"; HEAD="$PR_HEAD_SHA"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"

      - name: Scan for secrets (truffleHog)
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55  # v3.95.9
        with:
          base: ${{ steps.range.outputs.base }}
          head: ${{ steps.range.outputs.head }}
          extra_args: --results=verified,unknown

  vuln-scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    env:
      CGO_ENABLED: "0"
      GOFLAGS: -buildvcs=false
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Run govulncheck
        run: |
          go mod download
          go run ./src/cmd/apigen
          govulncheck ./...

  workflow-policy:
    name: Workflow SHA policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Enforce SHA-pinned third-party actions
        run: |
          # Every third-party action must be pinned to a full 40-char commit SHA
          bad=$(grep -RnE '^[[:space:]]*uses:' .github/ .gitea/ .forgejo/ 2>/dev/null | grep -vE '@[0-9a-f]{40}([[:space:]]|$)' || true)
          if [ -n "$bad" ]; then
            echo "::error::unpinned actions found:"
            echo "$bad"
            exit 1
          fi
          echo "OK: all actions pinned to SHA"

  image-scan:
    name: Image scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Build image for scan
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: search:scan
          build-args: |
            VERSION=scan
            BUILD_DATE=scan
            COMMIT_ID=scan

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: 'search:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          # gosu is bundled by the casjaysdev/alpine base image, unused by
          # this project (tini is our entrypoint/init) — we only scan our
          # own binaries, not upstream base-image tooling
          skip-files: '/usr/local/bin/gosu'
