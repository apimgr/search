name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly security run (Monday 06:00 UTC) — only security jobs run on schedule
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECTNAME: search
  PROJECTORG: apimgr

jobs:
  test:
    name: Test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    env:
      CGO_ENABLED: "0"
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run tests with coverage
        run: |
          PROJECT_ORG=$(sed -n '/^project_org:[[:space:]]*/ { s/^project_org:[[:space:]]*//; p; q; }' IDEA.md | tr -d '[:space:]')
          INTERNAL_NAME=$(sed -n '/^internal_name:[[:space:]]*/ { s/^internal_name:[[:space:]]*//; p; q; }' IDEA.md | tr -d '[:space:]')
          [ -n "$PROJECT_ORG" ] && [ -n "$INTERNAL_NAME" ]
          mkdir -p "${TMPDIR:-/tmp}/${PROJECT_ORG}"
          COVDIR=$(mktemp -d "${TMPDIR:-/tmp}/${PROJECT_ORG}/${INTERNAL_NAME}-XXXXXX")
          trap 'rm -rf "$COVDIR"' EXIT
          mkdir -p "$COVDIR/data"
          go mod download
          go run ./src/apigen
          go generate ./src/swagger/...
          go test -cover ./... -args -test.gocoverdir="$COVDIR/data"
          go tool covdata textfmt -i="$COVDIR/data" -o="$COVDIR/coverage.out"
          THRESHOLD=60
          PCT=$(go tool cover -func="$COVDIR/coverage.out" | awk '/^total:/ {gsub("%","",$3); print int($3)}')
          if [ "$PCT" -lt "$THRESHOLD" ]; then
            echo "::error::coverage $PCT% < threshold $THRESHOLD%"
            exit 1
          fi
          echo "Coverage: $PCT% (threshold: $THRESHOLD%)"
  lint:
    name: Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    env:
      CGO_ENABLED: "0"
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: go vet
        run: |
          go mod download
          go run ./src/apigen
          go generate ./src/swagger/...
          go vet ./...

      - name: staticcheck
        run: |
          go mod download
          go run ./src/apigen
          go generate ./src/swagger/...
          staticcheck ./...

      - name: golangci-lint
        run: |
          golangci-lint run

  build:
    name: Build
    if: github.event_name != 'schedule'
    needs: [test, lint]
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    env:
      CGO_ENABLED: "0"
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Compile server and client for the toolchain platform
        run: go build -buildvcs=false ./...
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # Empty base/head = full-history scan (schedule/manual runs and new-branch pushes).
      # Gate only confirmed credentials; verifier errors on historical matches
      # cannot establish that a credential is live and should not fail CI.
      - name: Determine scan range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE=""; HEAD=""
          if [ "$EVENT_NAME" = "push" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            BASE="$EVENT_BEFORE"; HEAD="$EVENT_SHA"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"; HEAD="$PR_HEAD_SHA"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"

      - name: Scan for secrets (truffleHog)
        uses: trufflesecurity/trufflehog@b2b0a92070f206ab7b5a1105d82a7f2f48d92341  # v3.99.0
        with:
          base: ${{ steps.range.outputs.base }}
          head: ${{ steps.range.outputs.head }}
          extra_args: --results=${{ steps.range.outputs.base == '' && 'verified' || 'verified,unknown' }} --exclude-paths=.github/trufflehog-exclude.txt

  vuln-scan:
    name: Vulnerability scan
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    env:
      CGO_ENABLED: "0"
      GOFLAGS: -buildvcs=false
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run govulncheck
        run: |
          go mod download
          go run ./src/apigen
          go generate ./src/swagger/...
          govulncheck ./...

  license-check:
    name: License check
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Verify shipped dependency licenses
        run: bash scripts/verify-licenses.sh

  workflow-policy:
    name: Workflow SHA policy
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Enforce SHA-pinned third-party actions
        run: |
          # Every third-party action must be pinned to a full 40-char commit SHA
          bad=$(grep -RnE '^[[:space:]]*uses:' .github/ .gitea/ .forgejo/ 2>/dev/null | grep -vE '@[0-9a-f]{40}([[:space:]]|$)' || true)
          if [ -n "$bad" ]; then
            echo "::error::unpinned actions found:"
            echo "$bad"
            exit 1
          fi
          echo "OK: all actions pinned to SHA"

  image-scan:
    name: Image scan (Trivy)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build image for scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: search:scan
          build-args: |
            VERSION=scan
            BUILD_DATE=scan
            COMMIT_ID=scan

      - name: Verify image runtime and Tor health
        run: bash tests/docker-image-check.sh search:scan

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: 'search:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          # gosu is bundled by the casjaysdev/alpine base image, unused by
          # this project (tini is our entrypoint/init) — we only scan our
          # own binaries, not upstream base-image tooling
          skip-files: '/usr/local/bin/gosu'
