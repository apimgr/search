name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  schedule:
    # Weekly security run (Monday 06:00 UTC) — only security jobs run on schedule
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ gitea.ref }}
  cancel-in-progress: true

env:
  PROJECTNAME: search
  PROJECTORG: apimgr

jobs:
  test:
    name: Test
    if: gitea.event_name != 'schedule'
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    env:
      CGO_ENABLED: "0"
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run tests with coverage
        run: |
          mkdir -p "/tmp/${PROJECTORG}"
          COVDIR=$(mktemp -d "/tmp/${PROJECTORG}/${PROJECTNAME}-XXXXXX")
          go mod download
          go run ./src/apigen
          go generate ./src/swagger/...
          go test -cover -coverprofile="${COVDIR}/coverage.out" ./...
          THRESHOLD=60
          PCT=$(go tool cover -func="${COVDIR}/coverage.out" | awk '/^total:/ {gsub("%","",$3); print int($3)}')
          if [ "$PCT" -lt "$THRESHOLD" ]; then
            echo "::error::coverage ${PCT}% is below threshold ${THRESHOLD}%"
            exit 1
          fi
          echo "Coverage: ${PCT}% (threshold: ${THRESHOLD}%)"

  lint:
    name: Lint
    if: gitea.event_name != 'schedule'
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    env:
      CGO_ENABLED: "0"
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: go vet
        run: |
          go mod download
          go run ./src/apigen
          go generate ./src/swagger/...
          go vet ./...

      - name: staticcheck
        run: |
          go mod download
          go run ./src/apigen
          go generate ./src/swagger/...
          staticcheck ./...

      - name: golangci-lint
        run: |
          golangci-lint run

  build:
    name: Build
    if: gitea.event_name != 'schedule'
    needs: [test, lint]
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
          - goos: freebsd
            goarch: amd64
          - goos: freebsd
            goarch: arm64
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    env:
      CGO_ENABLED: "0"
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set build info
        run: |
          {
            echo "VERSION=$(git rev-parse --short=7 HEAD 2>/dev/null || echo devel)"
            echo "COMMIT_ID=$(git rev-parse --short=7 HEAD 2>/dev/null || echo "unknown")"
            echo "BUILD_EPOCH=$(date -u +%s)"
            if [ -f site.txt ]; then
              echo "OFFICIAL_SITE=$(cat site.txt)"
            else
              echo "OFFICIAL_SITE=${{ secrets.OFFICIAL_SITE }}"
            fi
          } >> "$GITEA_ENV"

      - name: Generate API code
        run: |
          go mod download
          go run ./src/apigen
          go generate ./src/swagger/...

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          LDFLAGS="-s -w \
            -X 'github.com/apimgr/search/src/config.Version=${VERSION}' \
            -X 'github.com/apimgr/search/src/config.CommitID=${COMMIT_ID}' \
            -X 'github.com/apimgr/search/src/config.BuildEpoch=${BUILD_EPOCH}' \
            -X 'github.com/apimgr/search/src/config.OfficialSite=${OFFICIAL_SITE}' \
            -X 'github.com/apimgr/search/src/version.Version=${VERSION}' \
            -X 'github.com/apimgr/search/src/version.CommitID=${COMMIT_ID}' \
            -X 'github.com/apimgr/search/src/version.BuildEpoch=${BUILD_EPOCH}'"
          CLI_LDFLAGS="-s -w \
            -X 'github.com/apimgr/search/src/client/command.ProjectName=${PROJECTNAME}' \
            -X 'github.com/apimgr/search/src/client/command.Version=${VERSION}' \
            -X 'github.com/apimgr/search/src/client/command.CommitID=${COMMIT_ID}' \
            -X 'github.com/apimgr/search/src/client/command.BuildEpoch=${BUILD_EPOCH}' \
            -X 'github.com/apimgr/search/src/client/command.OfficialSite=${OFFICIAL_SITE}' \
            -X 'github.com/apimgr/search/src/client/api.ProjectName=${PROJECTNAME}' \
            -X 'github.com/apimgr/search/src/client/api.Version=${VERSION}'"
          go build -buildvcs=false -trimpath \
            -ldflags "$LDFLAGS" -o "/tmp/search-${GOOS}-${GOARCH}${{ matrix.ext }}" ./src
          if [ -d src/client ]; then
            go build -buildvcs=false -trimpath -tags gui \
              -ldflags "$CLI_LDFLAGS" -o "/tmp/search-cli-${GOOS}-${GOARCH}${{ matrix.ext }}" ./src/client
          fi
          echo "Build OK"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # Empty base/head = full-history scan (schedule/manual runs and new-branch pushes).
      # Gate only confirmed credentials; verifier errors on historical matches
      # cannot establish that a credential is live and should not fail CI.
      - name: Determine scan range
        id: range
        env:
          EVENT_NAME: ${{ gitea.event_name }}
          EVENT_BEFORE: ${{ gitea.event.before }}
          EVENT_SHA: ${{ gitea.sha }}
          PR_BASE_SHA: ${{ gitea.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ gitea.event.pull_request.head.sha }}
        run: |
          BASE=""; HEAD=""
          if [ "$EVENT_NAME" = "push" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            BASE="$EVENT_BEFORE"; HEAD="$EVENT_SHA"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"; HEAD="$PR_HEAD_SHA"
          fi
          echo "base=$BASE" >> "$GITEA_OUTPUT"
          echo "head=$HEAD" >> "$GITEA_OUTPUT"

      - name: Scan for secrets (truffleHog)
        uses: trufflesecurity/trufflehog@b2b0a92070f206ab7b5a1105d82a7f2f48d92341  # v3.99.0
        with:
          base: ${{ steps.range.outputs.base }}
          head: ${{ steps.range.outputs.head }}
          extra_args: --results=${{ steps.range.outputs.base == '' && 'verified' || 'verified,unknown' }} --exclude-paths=.github/trufflehog-exclude.txt

  vuln-scan:
    name: Vulnerability scan
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    env:
      CGO_ENABLED: "0"
      GOFLAGS: -buildvcs=false
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run govulncheck
        run: |
          go mod download
          go run ./src/apigen
          go generate ./src/swagger/...
          govulncheck ./...

  workflow-policy:
    name: Workflow SHA policy
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Enforce SHA-pinned third-party actions
        run: |
          # Every third-party action must be pinned to a full 40-char commit SHA
          bad=$(grep -RnE '^[[:space:]]*uses:' .github/ .gitea/ .forgejo/ 2>/dev/null | grep -vE '@[0-9a-f]{40}([[:space:]]|$)' || true)
          if [ -n "$bad" ]; then
            echo "::error::unpinned actions found:"
            echo "$bad"
            exit 1
          fi
          echo "OK: all actions pinned to SHA"

  image-scan:
    name: Image scan (Trivy)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Build image for scan
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: search:scan
          build-args: |
            VERSION=scan
            BUILD_DATE=scan
            COMMIT_ID=scan

      - name: Verify image runtime and Tor health
        run: bash tests/docker-image-check.sh search:scan

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: 'search:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          # gosu is bundled by the casjaysdev/alpine base image, unused by
          # this project (tini is our entrypoint/init) — we only scan our
          # own binaries, not upstream base-image tooling
          skip-files: '/usr/local/bin/gosu'
